# e2e/maestro/flows/smoke.yaml
# Cross-platform smoke: app launches and shows login or home.
appId: ${APP_ID}
---
- launchApp
- assertVisible:
    text: ".*"
    optional: true
- runFlow:
    when:
      visible: "Sign in"
    commands:
      - assertVisible: "Sign in"
- runFlow:
    when:
      visible: "InvoHub"
    commands:
      - assertVisible: "InvoHub"
