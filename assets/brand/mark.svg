<!-- assets/brand/mark.svg -->
<!--
  InvoHub brand mark — "the open ledger hub".

  Geometry (48x48 grid, every coordinate hand-computed, no curves):
  - Two mirrored corner brackets. Together they describe a chamfered square —
    a ledger page whose corner is cut — but the two chamfered faces are left
    OPEN, so the frame reads as a gateway rather than a closed box.
  - A self-similar chamfered square at the centre: the hub.
  - Two 45 degree links springing from the hub's own chamfered faces, out
    through both gates. Value enters through one gate, is recorded at the hub,
    and leaves through the other.

  The whole mark is built on one diagonal axis (x + y = 48), which is what makes
  it tile: repeated, the links of neighbouring marks meet end to end and form
  continuous diagonal chains. See mark-pattern.svg.

  Colour: everything inherits `currentColor`, so one fill recolours the mark for
  onDark or onLight use. The hub and links additionally read `--ih-mark-accent`,
  so the two-tone (navy frame + cornflower flow) lockup needs only that single
  custom property; without it the mark stays monotone and stays legible at 16px.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 48 48"
  width="48"
  height="48"
  fill="currentColor"
  role="img"
  aria-label="InvoHub"
>
  <title>InvoHub</title>
  <!-- Corner brackets (7-unit wall), open on the top-right / bottom-left diagonal. -->
  <path d="M30 6H6V30L13 27.1V13H27.1Z" />
  <path d="M18 42H42V18L35 20.9V35H20.9Z" />
  <!-- Hub + the two diagonal links. -->
  <g fill="var(--ih-mark-accent, currentColor)">
    <path d="M19 19H25.5L29 22.5V29H22.5L19 25.5Z" />
    <path d="M25.5 19L37.25 7.25L40.75 10.75L29 22.5Z" />
    <path d="M22.5 29L10.75 40.75L7.25 37.25L19 25.5Z" />
  </g>
</svg>
