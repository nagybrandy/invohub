<!-- assets/brand/directions/rounded/mark-pattern.svg -->
<!--
  InvoHub brand texture — DIRECTION B "rounded". Seamless 96x96 tile.

  At texture weight the brackets collapse to their centrelines (box 7.5..40.5,
  10.5-unit corner radius, cut at x + y = 34) and the flow stripe becomes the
  continuous chain. The heads are dropped — at hairline weight they would read
  as noise — and the hub dots carry the motif.

  Why it is seamless: every motif sits on the family of diagonals
  x + y = 48 + 48k. Translating the tile by 96 in x or y shifts x + y by
  96 = 2 * 48, which maps that family onto itself, so the chains run unbroken
  across tile edges. Only the three diagonals that cross the tile are drawn
  (x + y = 48, 96, 144), with butt caps so they meet their neighbours exactly at
  the edge. Nothing else touches an edge.

  Why it does not read as a grid: bracketed hubs and bare hubs alternate in a
  checker across the chains, so the eye follows diagonal movement instead of
  rows and columns. Rotating the tile in use breaks it up further.

  Use: `currentColor` at 4-8% opacity over navy (#111f4a) or over white / mist
  (#edf2fa), tiled at 96-240px, optionally rotated.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 96 96"
  width="96"
  height="96"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  <!-- Diagonal chains: x + y = 48, 96, 144. Butt caps so they meet exactly. -->
  <path stroke-linecap="butt" d="M0 48L48 0M0 96L96 0M48 96L96 48" />
  <!-- Rounded open brackets around the hubs on the 48 and 144 chains. -->
  <path d="M26.5 7.5H18A10.5 10.5 0 0 0 7.5 18V26.5" />
  <path d="M21.5 40.5H30A10.5 10.5 0 0 0 40.5 30V21.5" />
  <path d="M74.5 55.5H66A10.5 10.5 0 0 0 55.5 66V74.5" />
  <path d="M69.5 88.5H78A10.5 10.5 0 0 0 88.5 78V69.5" />
  <!-- Hubs. -->
  <g fill="currentColor" stroke="none">
    <circle cx="24" cy="24" r="3" />
    <circle cx="72" cy="72" r="3" />
    <circle cx="24" cy="72" r="3" />
    <circle cx="72" cy="24" r="3" />
  </g>
</svg>
