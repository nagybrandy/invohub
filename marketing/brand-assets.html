<!-- marketing/brand-assets.html -->
<!-- Source of truth for rendered brand rasters (OG cover, square logo). Screenshot the blocks to regenerate. -->
<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>InvoHub brand assets</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #2b2f38;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .block {
        position: relative;
        overflow: hidden;
      }

      #og {
        width: 1200px;
        height: 630px;
        padding: 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #0b1533;
        color: #ffffff;
      }

      #og::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1px);
        background-size: 30px 30px;
        mask-image: radial-gradient(80% 70% at 12% 4%, #000 0%, transparent 70%);
        opacity: 0.55;
      }

      #og::after {
        content: "";
        position: absolute;
        width: 720px;
        height: 720px;
        right: -260px;
        top: -300px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(100, 149, 237, 0.32) 0%, transparent 62%);
      }

      #og > * {
        position: relative;
        z-index: 1;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .lockup span {
        font-size: 34px;
        font-weight: 680;
        letter-spacing: -0.025em;
      }

      .og-title {
        margin: 0;
        font-size: 76px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        font-weight: 680;
        max-width: 17ch;
      }

      .og-title em {
        font-style: normal;
        color: #6495ed;
      }

      .og-meta {
        display: flex;
        gap: 28px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 22px;
        color: rgba(217, 231, 255, 0.78);
      }

      .og-meta li {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .og-meta i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6495ed;
      }

      /* Square, full-bleed source art: platforms apply their own icon masking. */
      #logo {
        width: 512px;
        height: 512px;
        display: grid;
        place-items: center;
        background: #111f4a;
      }
    </style>
  </head>
  <body>
    <div class="block" id="og">
      <div class="lockup">
        <!-- Geometry: assets/brand/mark.svg (direction "rounded", chosen) -->
        <svg width="52" height="52" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <g fill="#ffffff">
            <path d="M30 4H18A14 14 0 0 0 4 18V30L11 23V18A7 7 0 0 1 18 11H23Z" />
            <path d="M18 44H30A14 14 0 0 0 44 30V18L37 25V30A7 7 0 0 1 30 37H25Z" />
            <circle cx="17.5" cy="17.5" r="4.4" />
            <circle cx="30.5" cy="30.5" r="4.4" />
          </g>
          <path d="M7 41L41 7" stroke="#6495ed" stroke-width="6.5" stroke-linecap="round" />
          <circle cx="24" cy="24" r="5.5" fill="#6495ed" />
        </svg>
        <span>InvoHub</span>
      </div>

      <h1 class="og-title">A számlázás legyen a nap <em>biztos pontja</em>.</h1>

      <ul class="og-meta">
        <li><i></i>Bizonylat, PDF, e-mail</li>
        <li><i></i>Törzsadatok és emlékeztetők</li>
        <li><i></i>Web, iOS, Android</li>
      </ul>
    </div>

    <div class="block" id="logo">
      <!-- Geometry: assets/brand/mark.svg (direction "rounded", chosen) -->
      <svg width="400" height="400" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <g fill="#ffffff">
          <path d="M30 4H18A14 14 0 0 0 4 18V30L11 23V18A7 7 0 0 1 18 11H23Z" />
          <path d="M18 44H30A14 14 0 0 0 44 30V18L37 25V30A7 7 0 0 1 30 37H25Z" />
          <circle cx="17.5" cy="17.5" r="4.4" />
          <circle cx="30.5" cy="30.5" r="4.4" />
        </g>
        <path d="M7 41L41 7" stroke="#6495ed" stroke-width="6.5" stroke-linecap="round" />
        <circle cx="24" cy="24" r="5.5" fill="#6495ed" />
      </svg>
    </div>
  </body>
</html>
