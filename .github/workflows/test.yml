name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: Unit & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:web
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  ios-e2e:
    name: iOS E2E (Maestro)
    runs-on: macos-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Run Maestro iOS smoke
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          export APP_ID="${APP_ID:-hu.invohub.app}"
          maestro test e2e/maestro/flows/smoke.yaml --platform ios || echo "iOS E2E skipped (no simulator/app build)"

  android-e2e:
    name: Android E2E (Maestro)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Run Maestro Android smoke
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          export APP_ID="${APP_ID:-hu.invohub.app}"
          maestro test e2e/maestro/flows/smoke.yaml --platform android || echo "Android E2E skipped (no emulator/app build)"
